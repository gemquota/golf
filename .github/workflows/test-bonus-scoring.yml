name: Bonus scoring tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas urllib3
      - run: python -m py_compile bonus_scoring.py build_exports.py clean_bonuses.py export_viewer_data.py compare_bonus_scores.py golf.py main.py run_scraper.py run_fast.py
      - run: python -m unittest discover -s tests -v
