name: Deploy viewer to Pages

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: golf-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install dependencies
        working-directory: viewer
        run: npm ci
      - name: Build viewer
        working-directory: viewer
        env:
          BASE_PATH: /golf/
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Bootstraps the Pages site on first run if it doesn't exist yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v4
